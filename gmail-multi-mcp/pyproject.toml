[project]
name = "gmail-multi-mcp"
version = "0.1.0"
description = "Local MCP server that routes Gmail requests across multiple OAuth tokens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
gmail-multi-mcp = "gmail_multi_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_multi_mcp"]
